name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # network=host لازم است تا بیلدر به تونل localhost:5000 برسد
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Open SSH tunnel to server registry
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" | base64 -d > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -fN -o ExitOnForwardFailure=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -L 5000:127.0.0.1:5000 ubuntu@${{ secrets.SERVER_HOST }}
          curl -fsS http://127.0.0.1:5000/v2/

      - name: Set image name
        run: |
          REPO_NAME=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=localhost:5000/${REPO_NAME}" >> "$GITHUB_ENV"
          echo "Image will be: localhost:5000/${REPO_NAME}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        run: |
          curl -fsSL -X POST "${{ secrets.COOLIFY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
